<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godluck Gaming Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
}

h2{
color:#00ff99;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:95%;
padding:12px;
background:#00ff99;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

a{
color:#00ff99;
text-decoration:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="text">
Don't have an account?
<a onclick="signup()">Sign Up</a>
</p>

</div>

<script>

function login(){
alert("Demo Login Successful ✅");
}

function signup(){
document.getElementById("title").innerHTML="Sign Up";
document.querySelector("button").innerHTML="Create Account";
document.querySelector("button").onclick=create;

document.getElementById("text").innerHTML=
"Already have an account? <a onclick='back()'>Login</a>";
}

function create(){
alert("Demo Account Created ✅");
}

function back(){
location.reload();
}

</script>

</body>
</html>
