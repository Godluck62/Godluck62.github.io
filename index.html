<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godluck Gaming Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
}

h2{
color:#00ff99;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:95%;
padding:12px;
background:#00ff99;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

a{
color:#00ff99;
text-decoration:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="text">
Don't have an account?
<a onclick="signup()">Sign Up</a>
</p>

</div>

<script>

function login(){
alert("Demo Login Successful ✅");
}

function signup(){
document.getElementById("title").innerHTML="Sign Up";
document.querySelector("button").innerHTML="Create Account";
document.querySelector("button").onclick=create;

document.getElementById("text").innerHTML=
"Already have an account? <a onclick='back()'>Login</a>";
}

function create(){
alert("Demo Account Created ✅");
}

function back(){
location.reload();
}

</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godluck Number Game</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding-top:80px;
}

input,button{
padding:12px;
font-size:18px;
margin:10px;
}

button{
background:#00ff99;
border:none;
cursor:pointer;
}

#result{
font-size:22px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🎮 Guess The Number</h1>

<p>1 se 10 ke beech number guess karo.</p>

<input type="number" id="guess" min="1" max="10">

<button onclick="check()">Guess</button>

<h2 id="result"></h2>

<script>
let number=Math.floor(Math.random()*10)+1;

function check(){

let g=document.getElementById("guess").value;

if(g==number){
document.getElementById("result").innerHTML="🎉 Correct! You Win!";
number=Math.floor(Math.random()*10)+1;
}else if(g<number){
document.getElementById("result").innerHTML="📉 Too Small!";
}else{
document.getElementById("result").innerHTML="📈 Too Big!";
}

}
</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godluck Tic Tac Toe</title>
<style>
body{
background:#111;
font-family:Arial;
color:white;
text-align:center;
}
h1{
color:#00ff99;
}
.board{
display:grid;
grid-template-columns:repeat(3,100px);
gap:10px;
justify-content:center;
margin-top:30px;
}
.cell{
width:100px;
height:100px;
background:#222;
font-size:50px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
background:#00ff99;
border:none;
border-radius:8px;
}
</style>
</head>
<body>

<h1>🎮 Tic Tac Toe</h1>

<div class="board" id="board"></div>

<h2 id="status">Player X Turn</h2>

<button onclick="restart()">Restart</button>

<script>
let board=["","","","","","","","",""];
let player="X";
let gameOver=false;

const win=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

const b=document.getElementById("board");

function draw(){
b.innerHTML="";
board.forEach((v,i)=>{
let c=document.createElement("div");
c.className="cell";
c.innerHTML=v;
c.onclick=()=>move(i);
b.appendChild(c);
});
}

function move(i){
if(board[i]||gameOver)return;

board[i]=player;

for(let w of win){
let[a,b,c]=w;
if(board[a]&&board[a]==board[b]&&board[a]==board[c]){
document.getElementById("status").innerHTML="🎉 Player "+player+" Wins!";
gameOver=true;
draw();
return;
}
}

if(!board.includes("")){
document.getElementById("status").innerHTML="🤝 Draw!";
gameOver=true;
draw();
return;
}

player=player=="X"?"O":"X";
document.getElementById("status").innerHTML="Player "+player+" Turn";
draw();
}

function restart(){
board=["","","","","","","","",""];
player="X";
gameOver=false;
document.getElementById("status").innerHTML="Player X Turn";
draw();
}

draw();
</script>

</body>
</html>
